<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/lightbox.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style_product.css">
</head>
<body>
  <div id="navbar-placeholder"></div>
  <!-- TAM EKRAN SLIDER BÖLÜMÜ -->
    <section class="hero-slider-section">

      <!-- Sürüklenebilir Resim Alanı -->
      <div class="slider-track" id="slider-track">
        <!-- Resimler JS ile gelecek. Beklerken boş durmasın diye yükleniyor yazısı: -->
        <div style="width: 100vw; display:flex; align-items:center; justify-content:center;">
            <p class="text-muted">Yükleniyor...</p>
        </div>
      </div>

      <!-- Alt Orta Kontrol Butonları -->
      <div class="slider-controls">
        <button id="fullscreen-btn" title="Tam Ekran">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="black" stroke-width="1.5" viewBox="0 0 24 24"><path d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 1v4m0 0h-4m4 0l-5-5"/></svg>
        </button>
        <button id="play-pause-btn" title="Durdur/Oynat">
          <!-- Durdur İkonu (Varsayılan) -->
          <svg id="pause-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5zm5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5z"/></svg>
          <!-- Oynat İkonu (Gizli) -->
          <svg id="play-icon" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/></svg>
        </button>
      </div>

      <!-- SAĞ ALT YÜZEN BİLGİ PANELİ -->
      <div class="floating-info-panel">

        <!-- Başlık ve Favori İkonu -->
        <div class="fp-header">
          <div class="fp-title-area">
            <h1 id="p-name" class="fp-title">...</h1>
            <div id="p-price" class="fp-price-box">...</div>
          </div>
          <button class="fp-wishlist-btn" onclick="toggleFavorite()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter" class="bookmark-icon">
        <path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
    </svg>
  </button>
        </div>

        <!-- Renk Seçimi -->
        <div class="fp-color-section">
          <div id="color-container" class="fp-color-squares"></div>
          <div class="fp-color-ref">
            <span id="color-name">...</span> · REF. <span id="p-ref">0000/000</span>
          </div>
        </div>

        <hr class="fp-divider">

        <!-- Beden Seçimi -->
        <div class="fp-size-section">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fp-small-title">BEDENLER</span>
            <a href="#" onclick="openSizeGuide(event)" class="text-decoration-underline text-muted small">Ölçüleri Gör</a>
          </div>
          <div id="size-container" class="fp-sizes">
            <!-- JS ile dolacak -->
          </div>
          <div id="model-info" class="fp-model-info">Modelin boyu: 188 cm / bedeni: L</div>
        </div>

        <!-- Sepete Ekle -->
        <button class="fp-add-to-cart">SEPETE EKLE</button>

        <!-- Alt Bilgiler -->
        <div class="fp-footer-info">
          <div class="d-flex align-items-center gap-2 mb-1">
            <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M2.97 1.35A1 1 0 0 1 3.73 1h8.54a1 1 0 0 1 .76.35l2.609 3.044A1.5 1.5 0 0 1 16 5.37v.255a2.375 2.375 0 0 1-4.25 1.458A2.371 2.371 0 0 1 9.875 8 2.37 2.37 0 0 1 8 7.083 2.37 2.37 0 0 1 6.125 8a2.37 2.37 0 0 1-1.875-.917A2.375 2.375 0 0 1 0 5.625V5.37a1.5 1.5 0 0 1 .361-.976l2.61-3.045zm1.78 4.275a1.375 1.375 0 0 0 2.75 0 .5.5 0 0 1 1 0 1.375 1.375 0 0 0 2.75 0 .5.5 0 0 1 1 0 1.375 1.375 0 1 0 2.75 0V5.37a.5.5 0 0 0-.12-.325L12.27 2H3.73L1.12 5.045A.5.5 0 0 0 1 5.37v.255a1.375 1.375 0 0 0 2.75 0 .5.5 0 0 1 1 0zM1.5 8.5A.5.5 0 0 1 2 9v6h1v-5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v5h6V9a.5.5 0 0 1 1 0v6h-9a.5.5 0 0 1-.5-.5V9a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5-.5v4.5a.5.5 0 0 1-1 0V9a.5.5 0 0 1 .5-.5z"/></svg>
            <span style="font-size: 0.75rem;">Mağazadan teslim alma ÜCRETSİZ</span>
          </div>
          <div class="d-flex align-items-center gap-2">
            <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M0 3.5A1.5 1.5 0 0 1 1.5 2h9A1.5 1.5 0 0 1 12 3.5V5h1.02a1.5 1.5 0 0 1 1.17.563l1.481 1.85a1.5 1.5 0 0 1 .329.938V10.5a1.5 1.5 0 0 1-1.5 1.5H14a2 2 0 1 1-4 0H5a2 2 0 1 1-4 0 1 1 0 0 1-1-1v-1H2a2 2 0 0 1-2-2V3.5zm12 5a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-9 1a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm9 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg>
            <span style="font-size: 0.75rem;">2.599 TL ve üstü siparişlerde kargo ÜCRETSİZ</span>
          </div>
          <hr class="fp-divider" style="margin: 15px 0 10px 0;">

          <div class="d-flex justify-content-between align-items-center" onclick="openCommentsOffcanvas()" style="padding: 8px 0; cursor: pointer; opacity: 0.75; transition: all 0.3s ease;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.75'">
              <span class="m-0" style="font-size: 0.75rem; font-weight: 600; letter-spacing: 1px;">MÜŞTERİ YORUMLARI</span>
              <div class="d-flex align-items-center gap-2">
                  <span class="fw-bold text-dark" id="avgRatingDisplay" style="font-size: 0.8rem;">--/5</span>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18l6-6-6-6"/></svg>
              </div>
        </div>

        </div>
      </div>
    </section>
  <!-- STICKY ADD TO CART BAR -->
  <div id="premium-sticky-bar" class="premium-sticky-bar">
    <div class="psb-inner">
      <div class="psb-info">
          <img id="psb-img" class="psb-img" src="" alt="">
          <div class="psb-title-box">
             <h4 id="psb-title" class="psb-title">ÜRÜN ADI</h4>
             <span id="psb-color" class="psb-color">RENK</span>
          </div>
          <div class="psb-divider"></div>
          <div id="psb-price" class="psb-price">0.00 TL</div>
        </div>

      <div class="psb-actions">
        <div id="psb-sizes-container" class="psb-sizes">
          </div>
        <button id="psb-add-btn" class="psb-btn">SEPETE EKLE</button>
        <button class="psb-fav-btn" onclick="toggleFavorite()">
           <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter" class="bookmark-icon">
               <path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
           </svg>
        </button>
      </div>
    </div>
  </div>
  <div class="offcanvas offcanvas-end" tabindex="-1" id="commentsOffcanvas" style="width: 400px; border-left: none; box-shadow: -5px 0 25px rgba(0,0,0,0.05);">
        <div class="offcanvas-header border-bottom px-4 py-3">
            <h5 class="offcanvas-title fw-bold text-uppercase" style="letter-spacing: 1px; font-size: 1rem;">Değerlendirmeler</h5>
            <button type="button" class="btn-close shadow-none" data-bs-dismiss="offcanvas"></button>
        </div>

        <div class="offcanvas-body p-0 d-flex flex-column">
            <div class="flex-grow-1 overflow-auto p-4" id="commentsList">
                <div class="text-center text-muted small py-5">Yorumlar yükleniyor...</div>
            </div>

            <div class="border-top p-4 bg-light">
                <h6 class="fw-bold mb-3" style="font-size:0.85rem; text-transform: uppercase; letter-spacing: 1px;">Yorum Yap</h6>
                <form id="commentForm" onsubmit="submitComment(event)">
                    <div class="d-flex gap-1 mb-3" id="starRatingSelector">
                        </div>
                    <input type="hidden" id="selectedRating" value="5">
                    <textarea id="commentText" class="form-control rounded-0 border-dark shadow-none mb-3" rows="3" placeholder="Ürün hakkındaki düşüncelerinizi paylaşın..." required style="font-size:0.9rem;"></textarea>
                    <button type="submit" id="btnSubmitComment" class="btn btn-black w-100 rounded-0 fw-bold py-2" style="background:#000; color:#fff; letter-spacing: 1px;">GÖNDER</button>
                </form>
            </div>
        </div>
    </div>

  <!-- İLGİNİZİ ÇEKEBİLİR ALANI (Güncellenmiş Grid Yapısı) -->
  <!-- Bunu 'product-detail' sayfasındaki mevcut footer'ın üstüne koy -->
  <section class="container-fluid mt-5 pt-5 mb-5 border-top">
    <h3 class="text-center fw-bold tracking-widest mb-5">İlginizi Çekebilir</h3>

    <!-- Otomatik Doldurulacak Grid -->
    <div class="row g-3" id="similar-products-grid">
      <!-- JS ile dolacak -->
    </div>
  </section>

  <div id="dynamic-footer"></div>

<script>
    fetch('footer.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('dynamic-footer').innerHTML = html;
        });
</script>
    <!-- FOOTER BİTİŞ -->
  </body>
  </html>
<script src="js/bootstrap.bundle.min.js" charset="utf-8"></script>
  <script src="js/product-detail.js" charset="utf-8"></script>
  <script src="js/script.js"></script>
  <script src="js/login.js" charset="utf-8"></script>
  <script src="js/navbar.js" charset="utf-8"></script>
  <script src="js/cart.js"></script>
