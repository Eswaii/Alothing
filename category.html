<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

      <div id="dynamic-footer"></div>

  <script>
      fetch('footer.html')
          .then(response => response.text())
          .then(html => {
              document.getElementById('dynamic-footer').innerHTML = html;
          });
  </script>
