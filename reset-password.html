<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Şifre Belirle | ALOTHING</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; }
        .auth-box { max-width: 450px; margin: 100px auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); }
        .form-control-custom { border-radius: 0; border: 1px solid #ddd; padding: 15px; height: 55px; }
        .form-control-custom:focus { border-color: #000; box-shadow: none; }
        .btn-black { background: #000; color: #fff; border-radius: 0; height: 55px; font-weight: 700; }
        .btn-black:hover { background: #333; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-box text-center">
            <h2 class="fw-bold mb-3" style="letter-spacing: 2px;">ALOTHING</h2>
            <p class="text-muted mb-4 small">Lütfen hesabınız için yeni bir şifre belirleyin.</p>

            <form id="newPasswordForm">
                <input type="password" id="pass1" class="form-control form-control-custom mb-3" placeholder="Yeni Şifreniz" required minlength="6">
                <input type="password" id="pass2" class="form-control form-control-custom mb-4" placeholder="Yeni Şifrenizi Doğrulayın" required minlength="6">
                <button type="submit" id="btnSave" class="btn btn-black w-100 mb-3">Şifreyi Kaydet</button>
            </form>

            <div id="resetAlert" class="alert d-none small"></div>
        </div>
    </div>

    <script>
        document.getElementById('newPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass1 = document.getElementById('pass1').value;
            const pass2 = document.getElementById('pass2').value;
            const alertBox = document.getElementById('resetAlert');
            const token = new URLSearchParams(window.location.search).get('token');

            if (!token) {
                alertBox.classList.remove('d-none'); alertBox.classList.add('alert-danger');
                alertBox.innerHTML = "Geçersiz veya süresi dolmuş bir bağlantı."; return;
            }
            if (pass1 !== pass2) {
                  alertBox.classList.remove('d-none'); alertBox.classList.add('alert-danger');
                  alertBox.innerHTML = "Şifreler birbiriyle uyuşmuyor!"; return;
              }

              // BURASI YENİ EKLENDİ
              const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z]).{8,}$/;
              if (!passwordRegex.test(pass1)) {
                  alertBox.classList.remove('d-none'); alertBox.classList.add('alert-danger');
                  alertBox.innerHTML = "Şifreniz en az 8 karakter uzunluğunda olmalı; en az 1 büyük harf ve 1 küçük harf içermelidir.";
                  return;
              }

            const btn = document.getElementById('btnSave');
            btn.disabled = true; btn.innerHTML = "Kaydediliyor...";

            try {
                const res = await fetch('reset_password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, password: pass1 })
                });
                const data = await res.json();

                alertBox.classList.remove('d-none', 'alert-danger');
                if (data.success) {
                    alertBox.classList.add('alert-success');
                    alertBox.innerHTML = "Şifreniz başarıyla değiştirildi! Giriş yapabilirsiniz.";
                    document.getElementById('newPasswordForm').style.display = 'none';
                    setTimeout(() => window.location.href = "index.html?openAuth=login", 3000); // 3 sn sonra anasayfada giriş menüsünü açar
                } else {
                    alertBox.classList.add('alert-danger');
                    alertBox.innerHTML = data.message;
                    btn.disabled = false; btn.innerHTML = "Şifreyi Kaydet";
                }
            } catch(err) {
                alertBox.classList.remove('d-none'); alertBox.classList.add('alert-danger');
                alertBox.innerHTML = "Bir bağlantı hatası oluştu.";
            }
        });
    </script>
</body>
</html>
