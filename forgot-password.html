<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifremi Unuttum | ALOTHING</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; }
        .auth-box { max-width: 450px; margin: 100px auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); }
        .form-control-custom { border-radius: 0; border: 1px solid #ddd; padding: 15px; height: 55px; }
        .form-control-custom:focus { border-color: #000; box-shadow: none; }
        .btn-black { background: #000; color: #fff; border-radius: 0; height: 55px; font-weight: 700; letter-spacing: 1px; }
        .btn-black:hover { background: #333; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-box text-center">
            <h2 class="fw-bold mb-3" style="letter-spacing: 2px;">ALOTHING</h2>
            <p class="text-muted mb-4 small">Şifrenizi sıfırlamak için kayıtlı e-posta adresinizi giriniz.</p>

            <form id="forgotForm">
                <input type="email" id="resetEmail" class="form-control form-control-custom mb-3" placeholder="E-Posta Adresiniz" required>
                <button type="submit" id="btnReset" class="btn btn-black w-100 mb-3">Sıfırlama Linki Gönder</button>
            </form>

            <div id="resetAlert" class="alert d-none small"></div>
            <a href="index.html" class="text-dark small fw-bold text-decoration-none">← Mağazaya Dön</a>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnReset');
            const alertBox = document.getElementById('resetAlert');
            const email = document.getElementById('resetEmail').value;

            btn.disabled = true;
            btn.innerHTML = "Gönderiliyor...";
            alertBox.classList.add('d-none');

            try {
                const res = await fetch('forgot_password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                const data = await res.json();

                alertBox.classList.remove('d-none', 'alert-danger');
                if (data.success) {
                    alertBox.classList.add('alert-success');
                    alertBox.innerHTML = "Şifre sıfırlama linki e-posta adresinize gönderildi. Lütfen gelen kutunuzu kontrol edin.";
                } else {
                    alertBox.classList.add('alert-danger');
                    alertBox.innerHTML = data.message;
                    btn.disabled = false;
                    btn.innerHTML = "Sıfırlama Linki Gönder";
                }
            } catch(err) {
                alertBox.classList.remove('d-none');
                alertBox.classList.add('alert-danger');
                alertBox.innerHTML = "Bir bağlantı hatası oluştu.";
                btn.disabled = false;
                btn.innerHTML = "Sıfırlama Linki Gönder";
            }
        });
    </script>
</body>
</html>
