<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorilerim - ALOTHING</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/style_category.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
      /* =========================================
         ULTRA PREMIUM ÜRÜN KARTI & HIZLI EKLE
      ========================================= */
      .fav-header-area { text-align: center; margin-bottom: 3rem; padding-bottom: 2rem; border-bottom: 1px solid #eaeaea; }

      .premium-card { cursor: pointer; position: relative; }

      /* Görsel Alanı */
      .pc-img-wrapper {
          position: relative;
          aspect-ratio: 3/4; /* Tam lüks moda markası ölçüsü */
          overflow: hidden;
          background: #f8f8f8;
      }
      .pc-img {
          width: 100%; height: 100%; object-fit: cover;
          transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .premium-card:hover .pc-img { transform: scale(1.05); }

      /* Hızlı Ekle Paneli (Aşağıdan Kayarak Çıkar) */
      .quick-add-panel {
          position: absolute; bottom: 0; left: 0; width: 100%;
          background: rgba(255, 255, 255, 0.85);
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
          padding: 15px 10px;
          transform: translateY(100%);
          transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
          display: flex; flex-direction: column; align-items: center; gap: 8px;
          border-top: 1px solid rgba(0,0,0,0.05);
      }
      .premium-card:hover .quick-add-panel { transform: translateY(0); }

      .qa-title { font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; color: #000; text-transform: uppercase; margin-bottom: 2px;}
      .qa-sizes { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

      /* Hızlı Ekle Beden Butonları */
      .qa-size-btn {
          width: 32px; height: 32px; padding: 0;
          border: 1px solid #ddd; background: #fff; border-radius: 50%;
          font-size: 0.75rem; font-weight: 700; color: #333;
          display: flex; align-items: center; justify-content: center;
          cursor: pointer; transition: all 0.2s ease;
      }
      .qa-size-btn:hover { border-color: #000; background: #000; color: #fff; transform: translateY(-2px); }

      /* Favoriden Çıkarma Butonu */
      .pc-fav-btn {
          position: absolute; top: 12px; right: 12px;
          background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px);
          border: none; width: 34px; height: 34px; border-radius: 50%;
          display: flex; align-items: center; justify-content: center;
          opacity: 0; transform: translateY(-10px);
          transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.08); z-index: 5;
      }
      .premium-card:hover .pc-fav-btn { opacity: 1; transform: translateY(0); }
      .pc-fav-btn:hover { background: #fff; transform: scale(1.1); }

      /* Ürün Bilgileri (Resmin Altında Tertemiz) */
      .pc-info { margin-top: 15px; display: flex; flex-direction: column; gap: 4px; }
      .pc-title { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.5px;}
      .pc-price { font-size: 0.9rem; font-weight: 700; color: #555; }

      /* Mobilde Paneli Hep Görünür Yap veya İkona Çevir */
      @media (max-width: 991px) {
          .pc-fav-btn { opacity: 1; transform: translateY(0); }
          .quick-add-panel { padding: 10px 5px; }
          .qa-title { display: none; } /* Mobilde yer kazanmak için başlığı gizle */
          .qa-size-btn { width: 28px; height: 28px; font-size: 0.7rem; }
      }
  </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="container mt-5 pt-4 mb-5" style="min-height: 60vh; max-width: 1400px;">

        <div class="fav-header-area">
            <h2 class="fw-bold m-0 text-uppercase" style="letter-spacing: 2px;">Favorilerim</h2>
            <div class="text-muted small mt-2 text-uppercase" id="fav-count" style="letter-spacing: 1px;">0 ÜRÜN</div>
        </div>

        <div class="row g-3 g-md-4" id="favorites-grid">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-dark spinner-border-sm" role="status"></div>
                <p class="text-muted mt-3 small text-uppercase" style="letter-spacing: 1px;">Yükleniyor...</p>
            </div>
        </div>
    </div>
    <div id="dynamic-footer"></div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        loadFavorites();
    });

    async function loadFavorites() {
        const userStr = localStorage.getItem('user') || sessionStorage.getItem('user');
        let user = null;
        if (userStr && userStr !== "undefined") user = JSON.parse(userStr);
        let savedIds = [];

        if (user && user.email) {
            try {
                const res = await fetch('get_favorites.php?email=' + user.email);
                const data = await res.json();
                if(data.success) savedIds = data.favorites.map(String);
            } catch(e) {}
        } else {
            savedIds = JSON.parse(localStorage.getItem('favorites')) || [];
        }

        document.getElementById('fav-count').innerText = `${savedIds.length} ÜRÜN`;
        const grid = document.getElementById('favorites-grid');

        if (savedIds.length === 0) {
            grid.innerHTML = `
                <div class="col-12 text-center py-5 mt-3">
                    <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="1" class="mb-4"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                    <h5 class="fw-bold mb-3 text-uppercase" style="letter-spacing: 1px; color:#000;">Favorileriniz Boş</h5>
                    <p class="text-muted small mb-4 mx-auto" style="max-width: 400px; line-height:1.6;">Beğendiğiniz ürünleri favorilerinize ekleyerek daha sonra kolayca satın alabilirsiniz.</p>
                    <a href="index.html" class="btn btn-black rounded-0 px-5 py-3 fw-bold" style="background:#000; color:#fff; letter-spacing: 1px;">ALIŞVERİŞE BAŞLA</a>
                </div>`;
            return;
        }

        fetch('api.php')
            .then(res => res.json())
            .then(products => {
                const favProducts = products.filter(p => savedIds.includes(p.id.toString()));

                grid.innerHTML = favProducts.map(product => {
                    let imageSrc = "images/default.jpg";
                    let cartImageSrc = "images/default.jpg";

                    if(product.images) {
                        let imgs = product.images;
                        if(typeof imgs === 'string') { try { imgs = JSON.parse(imgs); } catch(e) { imgs = imgs.split(','); } }
                        if(Array.isArray(imgs) && imgs.length > 0) {
                            imageSrc = imgs[0].trim();
                            cartImageSrc = imgs.length > 4 ? imgs[4].trim() : imgs[0].trim();
                        }
                        if(imageSrc.startsWith('../')) imageSrc = imageSrc.substring(3);
                        if(cartImageSrc.startsWith('../')) cartImageSrc = cartImageSrc.substring(3);
                    }

                    // BEDEN BUTONLARINI OLUŞTURMA (Hızlı Ekle) - DÜZELTİLEN KISIM
                    let sizesHTML = "";
                    if (product.sizes) {
                        let sizesArr = typeof product.sizes === 'string' ? product.sizes.split(',') : product.sizes;
                        sizesHTML = sizesArr.map(s => {
                            // "48:2" gibi gelen veriyi ":" işaretinden bölüyoruz
                            let sizeParts = s.trim().split(':');
                            let cleanSize = sizeParts[0].trim().toUpperCase(); // İlk kısım: "48" (Beden)
                            let stock = sizeParts.length > 1 ? parseInt(sizeParts[1]) : 1; // İkinci kısım: "2" (Stok)

                            // Eğer stok sıfır veya sıfırdan küçükse butonu hiç oluşturma (Tükendi)
                            if (stock <= 0) return '';

                            return `<button class="qa-size-btn" onclick="quickAddToCart(event, ${product.id}, '${product.name.replace(/'/g, "\\'")}', '${product.price}', '${cleanSize}', '${cartImageSrc}')">${cleanSize}</button>`;
                        }).join('');
                    }

                    // ESKİ FİYAT VE İNDİRİM KONTROLÜ
                    const oldPriceVal = product.old_price || product.oldPrice;
                    let priceHTML = `<div class="pc-price">${product.price}</div>`;
                    if (oldPriceVal && oldPriceVal !== "0.00 TL" && parseFloat(oldPriceVal) > 0) {
                        priceHTML = `<div class="pc-price"><span class="text-decoration-line-through text-muted small me-1" style="font-weight:500;">${oldPriceVal}</span> <span class="text-danger fw-bold">${product.price}</span></div>`;
                    }

                    return `
                    <div class="col-6 col-md-4 col-lg-3">
                        <div class="premium-card" onclick="window.location.href='product-detail.html?id=${product.id}'">

                            <div class="pc-img-wrapper">
                                <img src="${imageSrc}" class="pc-img">

                                <button class="pc-fav-btn" onclick="event.stopPropagation(); removeFavorite(this, ${product.id})" title="Favorilerden Çıkar">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="black" stroke="black" stroke-width="1.5"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                                </button>

                                <div class="quick-add-panel">
                                    <div class="qa-sizes">
                                        ${sizesHTML}
                                    </div>
                                </div>
                            </div>

                            <div class="pc-info">
                                <div class="pc-title">${product.name}</div>
                                ${priceHTML}
                            </div>

                        </div>
                    </div>`;
                }).join('');
            });
    }

    // DOĞRUDAN SEPETE EKLEME FONKSİYONU
    function quickAddToCart(event, id, name, price, size, image) {
        event.stopPropagation();

        const btn = event.currentTarget;
        const originalText = btn.innerText;

        btn.innerText = "✓";
        btn.style.background = "#000";
        btn.style.color = "#fff";
        btn.style.borderColor = "#000";

        setTimeout(() => {
            btn.innerText = originalText;
            btn.style.background = "#fff";
            btn.style.color = "#333";
            btn.style.borderColor = "#ddd";
        }, 1500);

        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const existing = cart.find(item => item.id == id && item.size == size);

        if(existing) {
            existing.quantity += 1;
        } else {
            cart.push({ id, name, price, size, image, quantity: 1 });
        }

        localStorage.setItem('cart', JSON.stringify(cart));

        if(typeof updateCartUI === 'function') updateCartUI();

        const cartOffcanvasEl = document.getElementById('cartOffcanvas');
        if(cartOffcanvasEl) {
            bootstrap.Offcanvas.getOrCreateInstance(cartOffcanvasEl).show();
        }
    }

    async function removeFavorite(btn, id) {
        event.stopPropagation();
        const userStr = localStorage.getItem('user') || sessionStorage.getItem('user');
        let user = null;
        if (userStr && userStr !== "undefined") user = JSON.parse(userStr);

        if (user && user.email) {
            await fetch('toggle_favorite.php', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: user.email, product_id: id })
            });
        } else {
            let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
            favorites = favorites.filter(favId => favId !== id.toString());
            localStorage.setItem('favorites', JSON.stringify(favorites));
        }

        const card = btn.closest('.col-6');
        card.style.transition = "all 0.3s ease";
        card.style.opacity = "0";
        card.style.transform = "scale(0.9)";

        setTimeout(() => { loadFavorites(); }, 300);
    }
  </script>
<script src="js/script.js"></script>
<script src="js/login.js" charset="utf-8"></script>
<script src="js/navbar.js" charset="utf-8"></script>
<script src="js/bootstrap.bundle.min.js" charset="utf-8"></script>
<script src="js/cart.js"></script>
</body>
</html>
