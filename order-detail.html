<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sipariş Detayı - ALOTHING</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
      body { font-family: 'Inter', sans-serif; background-color: #fcfcfc; color: #000; }
      .detail-card { background: #fff; border: 1px solid #eee; padding: 40px; margin-top: 40px; }
      .status-badge { padding: 10px 20px; font-weight: 600; letter-spacing: 1px; }
      .item-img { width: 100px; height: 130px; object-fit: cover; }
      .btn-black { background: #000; color: #fff; padding: 15px 30px; font-weight: 700; border-radius: 0; text-decoration: none; }
      .btn-black:hover { background: #333; color: #fff; }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="container mb-5">
      <div class="row justify-content-center">
          <div class="col-lg-9">
              <div class="mt-5">
                  <a href="account.html" class="text-dark fw-bold text-decoration-none small">
                      ← SİPARİŞLERİME GERİ DÖN
                  </a>
              </div>

              <div id="orderContent" class="detail-card">
                  <p class="text-center py-5">Sipariş detayları yükleniyor...</p>
                  <div id="trackingContainer" class="mt-4" style="display: none;"></div>
              </div>
          </div>
      </div>
  </div>
  <div class="modal fade" id="cancelReturnModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content border-0 rounded-0">
              <div class="modal-header border-bottom-0">
                  <h5 class="modal-title fw-bold" id="modalTitle">İŞLEM NEDENİ</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body p-4">
                  <p id="modalDescription" class="small text-muted mb-4"></p>
                  <div class="form-floating-custom-border mb-4">
                      <select id="requestReason" class="form-select text-dark fw-bold" style="height: 55px; border: 1px solid #ccc; border-radius: 4px; padding: 10px 15px; width: 100%;">
                          <option value="">Lütfen bir neden seçin</option>
                          <option value="Vazgeçtim">Almaktan vazgeçtim</option>
                          <option value="Yanlış Ürün/Beden">Yanlış ürün/beden sipariş ettim</option>
                          <option value="Teslimat Süresi">Teslimat süresi çok uzun</option>
                          <option value="Diğer">Diğer</option>
                      </select>
                  </div>
                  <button type="button" class="btn-black w-100 py-3" onclick="submitCancelReturnRequest()">TALEBİ GÖNDER</button>
              </div>
          </div>
      </div>
  </div>
  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/order-detail.js"></script>
  <div id="dynamic-footer"></div>

<script>
    fetch('footer.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('dynamic-footer').innerHTML = html;
        });
</script>
</body>
</html>
