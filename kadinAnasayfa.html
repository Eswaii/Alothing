<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kadın - ALOTHING</title>
  <!--CSS -->
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/lightbox.css">
  <link rel="stylesheet" href="css/style.css?v=999">
  <link rel="stylesheet" href="css/featured.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="navbar-placeholder"></div>
  <!-- Slider Başlangıç -->
  <section class="hero-slider">
    <div id="mainCarousel" class="carousel slide" data-bs-ride="false">

      <div class="carousel-inner">
        <div class="carousel-item active">
          <a href="#" class="slide-link"></a>
          <img id="gunluk-resim-slider" src="images/slider/woman.jpg" class="d-block w-100">
          <div class="carousel-caption">
            <h1 class="py-2">CEKETLER</h1>
          </div>
        </div>

        <div class="carousel-item">
          <a href="#" class="slide-link"></a>
          <img id="gunluk-resim-slider2" src="images/slider/woman2.jpg" class="d-block w-100">
          <div class="carousel-caption">
            <h1 class="py-2">AYAKKABILAR</h1>
          </div>
        </div>

        <div class="carousel-item">
          <a href="#" class="slide-link"></a>
          <img id="gunluk-resim-slider3" src="images/slider/woman3.jpg" alt="">
          <div class="carousel-caption">
            <h1 class="py-2">SWEATSHIRTLER</h1>
          </div>
        </div>
      </div>

      <!-- OKLAR -->
      <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>

      <button class="carousel-control-next" type="id="gunluk-resim-slider"button" data-bs-target="#mainCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>

      <!-- PROGRESS BARS -->
      <div class="slider-progress">
        <div class="bar"><div class="fill"></div></div>
        <div class="bar"><div class="fill"></div></div>
        <div class="bar"><div class="fill"></div></div>
      </div>
    </div>

  </section>
  <!--  Slider bitiş -->

  <!-- Content başlangıç-->
  <div class="content-layer">

    <section class="category-grid container-fluid px-0">
      <div class="row g-2">
        <div class="col-md-4 col-12">
          <a href="category.html?cat=wceket" class="category-card">
            <img src="images/ana_ekran_kategoriler_kadin/ceket.jpg" alt="">
            <span class="category-title">CEKETLER VE MONTLAR</span>
          </a>
        </div>
        <div class="col-md-4 col-12">
          <a href="category.html?cat=wkot-pantolon" class="category-card">
            <img src="images/ana_ekran_kategoriler_kadin/kotpantolon.jpg" alt="">
            <span class="category-title">KOT PANTOLONLAR</span>
          </a>
        </div>
        <div class="col-md-4 col-12">
          <a href="category.html?cat=elbise" class="category-card">
            <img src="images/ana_ekran_kategoriler_kadin/elbise.jpg" alt="">
            <span class="category-title">ELBİSELER</span>
          </a>
        </div>
        <div class="col-md-4 col-12">
          <a href="category.html?cat=wpantolon" class="category-card">
            <img src="images/ana_ekran_kategoriler_kadin/pantolon.jpg" alt="">
            <span class="category-title">PANTOLONLAR</span>
          </a>
        </div>
        <div class="col-md-4 col-12">
          <a href="category.html?cat=wtisort" class="category-card">
            <img src="images/ana_ekran_kategoriler_kadin/tisortler.jpg" alt="">
            <span class="category-title">TİŞÖRTLER</span>
          </a>
        </div>
        <div class="col-md-4 col-12">
          <a href="category.html?cat=wsweatshirt" class="category-card">
            <img src="images/ana_ekran_kategoriler_kadin/sweatshirt.jpg" alt="">
            <span class="category-title">SWEATSHIRT VE HOODIELER</span>
          </a>
        </div>
      </div>
  </section>
      <!-- Content bitiş -->

      <!--Featured başlangıç-->
      <a href="category.html?cat=windirim" class="featured-tile fullscreen-tile my-1">
        <div class="featured-img">
          <img src="images/featured/woman.jpg" alt="">
        </div>

        <div class="featured-content">
          <h3>İNDİRİM</h3>
          <span class="featured-btn">KEŞFET</span>
        </div>
      </a>
      <!--Featured bitiş-->

      <!-- İLGİNİZİ ÇEKEBİLİR (SLIDER) -->
      <section class="container-fluid px-4 mt-5 mb-5 border-top pt-5">

          <!-- Başlık -->
          <h3 class="fw-bold tracking-widest mb-4 ps-1 text-uppercase"><span class="me-2">→</span> İLGİNİZİ ÇEKEBİLİR</h3>

          <!-- Slider Kapsayıcı -->
          <div class="slider-wrapper position-relative">

              <!-- Sol Buton -->
              <button id="slideLeft" class="slider-nav-btn btn-prev">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
              </button>

              <!-- Kayan Alan -->
              <div id="product-scroll-container" class="d-flex gap-3 align-items-stretch">
                  <!-- JS BURAYI DOLDURACAK -->
              </div>

              <!-- Sağ Buton -->
              <button id="slideRight" class="slider-nav-btn btn-next">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
              </button>

          </div>
      </section>
      <div id="dynamic-footer"></div>

  </div>
  <script>
document.addEventListener("DOMContentLoaded", function() {
  fetch('footer.html')
      .then(response => response.text())
      .then(html => {
          document.getElementById('dynamic-footer').innerHTML = html;
      });
    // 1. Resim listeniz
    const resimListesi = [
      "images/slider/woman.jpg",
      "images/slider/woman2.jpg",
      "images/slider/woman3.jpg",
      "images/slider/woman4.jpg",
      "images/slider/woman5.jpg",
      "images/slider/woman6.jpg",
      "images/slider/woman7.jpg",
      "images/slider/woman8.jpg",
      "images/slider/woman9.jpg"
    ];


    // 2. Bugunun tarihini al (Ayın kaçı?)
    const bugun = new Date();
    const gun = bugun.getDate(); // 1 ile 31 arası sayı verir

    // 3. Gün sayısını resim sayısına bölüp kalanı bul (Mod alma)
    // Bu sayede liste bitse bile başa döner (Döngü sağlar)
    const resimIndeksi = gun % resimListesi.length;

    // 4. Resmi değiştir
    const resimElementi = document.getElementById("gunluk-resim-slider");
    if (resimElementi) {
        resimElementi.src = resimListesi[resimIndeksi];
    }
  });

document.addEventListener("DOMContentLoaded", function() {
    // 1. Resim listeniz
    const resimListesi2 = [
      "images/slider/woman.jpg",
      "images/slider/woman2.jpg",
      "images/slider/woman3.jpg",
      "images/slider/woman4.jpg",
      "images/slider/woman5.jpg",
      "images/slider/woman6.jpg",
      "images/slider/woman7.jpg",
      "images/slider/woman8.jpg",
      "images/slider/woman9.jpg"
    ];


    // 2. Bugunun tarihini al (Ayın kaçı?)
    const bugun2 = new Date();
    const gun2 = bugun2.getDate(); // 1 ile 31 arası sayı verir

    // 3. Gün sayısını resim sayısına bölüp kalanı bul (Mod alma)
    // Bu sayede liste bitse bile başa döner (Döngü sağlar)
    const resimIndeksi2 = (gun2+1) % resimListesi2.length;

    // 4. Resmi değiştir
    const resimElementi2 = document.getElementById("gunluk-resim-slider2");
    if (resimElementi2) {
        resimElementi2.src = resimListesi2[resimIndeksi2];
    }
  });
document.addEventListener("DOMContentLoaded", function() {
    // 1. Resim listeniz
    const resimListesi3 = [
      "images/slider/woman.jpg",
      "images/slider/woman2.jpg",
      "images/slider/woman3.jpg",
      "images/slider/woman4.jpg",
      "images/slider/woman5.jpg",
      "images/slider/woman6.jpg",
      "images/slider/woman7.jpg",
      "images/slider/woman8.jpg",
      "images/slider/woman9.jpg"
    ];


    // 2. Bugunun tarihini al (Ayın kaçı?)
    const bugun3 = new Date();
    const gun3 = bugun3.getDate(); // 1 ile 31 arası sayı verir

    // 3. Gün sayısını resim sayısına bölüp kalanı bul (Mod alma)
    // Bu sayede liste bitse bile başa döner (Döngü sağlar)
    const resimIndeksi3 = (gun3+2) % resimListesi3.length;

    // 4. Resmi değiştir
    const resimElementi3 = document.getElementById("gunluk-resim-slider3");
    if (resimElementi3) {
        resimElementi3.src = resimListesi3[resimIndeksi3];
    }
  });
      </script>
</body>
</html>
